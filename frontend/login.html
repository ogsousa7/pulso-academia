<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Pulso Academia</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['Montserrat', 'sans-serif'] },
        colors: {
          offwhite: '#FBFBFB', grafite: '#1F1F1F', petroleo: '#425B63',
          oliva: '#7C8A5A', terracota: '#C47A52',
        }
      }
    }
  }
</script>
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#425B63">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="img/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="img/icons/favicon-16.png">
<link rel="apple-touch-icon" href="img/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pulso">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

</head>

<body class="bg-offwhite text-grafite antialiased font-sans min-h-screen flex items-center justify-center px-6">

<div class="w-full max-w-sm">
  <a href="index.html" class="flex items-center gap-2 justify-center mb-8">
    <img src="img/logo-icon.png" alt="" class="h-7 w-auto">
    <span class="text-lg font-bold tracking-wide">PULSO</span>
  </a>

  <div class="bg-white border border-grafite/10 rounded-3xl p-8">

    <!-- Abas Login / Cadastro -->
    <div class="flex border border-grafite/15 rounded-full p-1 mb-6 text-sm font-semibold">
      <button id="tabLogin" class="flex-1 py-2 rounded-full bg-grafite text-white transition">Entrar</button>
      <button id="tabRegister" class="flex-1 py-2 rounded-full text-grafite/60 transition">Criar conta</button>
    </div>

    <!-- FORM: LOGIN -->
    <form id="loginForm" class="flex flex-col gap-4">
      <div>
        <label class="text-xs font-semibold text-grafite/60" for="loginEmail">E-mail</label>
        <input id="loginEmail" type="email" required placeholder="voce@email.com"
          class="w-full mt-1 border border-grafite/15 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-petroleo">
      </div>
      <div>
        <label class="text-xs font-semibold text-grafite/60" for="loginSenha">Senha</label>
        <input id="loginSenha" type="password" required placeholder="••••••••"
          class="w-full mt-1 border border-grafite/15 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-petroleo">
      </div>
      <button type="submit" id="loginSubmitBtn" class="mt-2 w-full py-3.5 rounded-full bg-petroleo text-white font-semibold hover:opacity-90 transition flex items-center justify-center gap-2">
        <span>Entrar</span>
      </button>
      <div class="bg-grafite/5 rounded-xl p-4 text-xs text-grafite/60 leading-relaxed">
        <p class="font-semibold text-grafite mb-1">Contas de demonstração:</p>
        <p>Recepção: <span class="font-mono">admin@pulso.com</span> / <span class="font-mono">admin123</span></p>
        <p>Aluna: <span class="font-mono">camila@aluno.com</span> / <span class="font-mono">aluno123</span></p>
      </div>
    </form>

    <!-- FORM: CADASTRO -->
    <form id="registerForm" class="hidden flex-col gap-4">
      <div>
        <label class="text-xs font-semibold text-grafite/60" for="regNome">Nome completo</label>
        <input id="regNome" type="text" required placeholder="Seu nome"
          class="w-full mt-1 border border-grafite/15 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-petroleo">
      </div>
      <div>
        <label class="text-xs font-semibold text-grafite/60" for="regEmail">E-mail</label>
        <input id="regEmail" type="email" required placeholder="voce@email.com"
          class="w-full mt-1 border border-grafite/15 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-petroleo">
      </div>
      <div>
        <label class="text-xs font-semibold text-grafite/60" for="regSenha">Senha</label>
        <input id="regSenha" type="password" required minlength="6" placeholder="mínimo 6 caracteres"
          class="w-full mt-1 border border-grafite/15 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-petroleo">
      </div>
      <button type="submit" id="registerSubmitBtn" class="mt-2 w-full py-3.5 rounded-full bg-oliva text-white font-semibold hover:opacity-90 transition">
        Criar conta de aluno(a)
      </button>
    </form>

    <!-- Login com Google: só aparece se o servidor tiver GOOGLE_CLIENT_ID configurado -->
    <div id="googleArea" class="hidden mt-6">
      <div class="flex items-center gap-3 mb-4 text-xs text-grafite/40">
        <span class="flex-1 h-px bg-grafite/10"></span>ou<span class="flex-1 h-px bg-grafite/10"></span>
      </div>
      <div id="googleBtn" class="flex justify-center min-h-[44px]"></div>
      <p class="text-[11px] text-grafite/40 text-center mt-3">Contas da recepção e dos professores entram com e-mail e senha.</p>
    </div>

  </div>

  <p class="text-center text-xs text-grafite/40 mt-6">
    <a href="index.html" class="hover:text-petroleo">← Voltar para o site</a>
  </p>
</div>

<div id="toastContainer" class="fixed bottom-6 right-6 z-[100] flex flex-col gap-3 items-end" aria-live="polite"></div>

<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/login.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
