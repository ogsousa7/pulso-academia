<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sem conexão — Pulso Academia</title>
<meta name="theme-color" content="#425B63">
<link rel="icon" href="favicon.ico" sizes="any">
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
         font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #F5F5F7; color: #1D1D1F; text-align: center; }
  img { height: 56px; margin-bottom: 24px; }
  h1 { font-size: 28px; letter-spacing: -0.02em; margin: 0 0 8px; }
  p { color: rgba(31,31,31,.6); margin: 0 0 24px; max-width: 320px; line-height: 1.5; }
  button { background: #425B63; color: #fff; border: 0; border-radius: 999px; padding: 14px 28px; font: inherit; font-weight: 600; cursor: pointer; }
  @media (prefers-color-scheme: dark) {
    body { background: #000; color: #F5F5F7; }
    p { color: rgba(245,245,247,.7); }
    img { filter: brightness(0) invert(.93); }
    button { background: #4F7480; }
  }
</style>
</head>
<body>
  <main>
    <img src="img/logo-icon.png" alt="Pulso Academia">
    <h1>Você está sem internet</h1>
    <p>Não conseguimos carregar essa página agora. Confira sua conexão e tente de novo.</p>
    <button onclick="location.reload()">Tentar novamente</button>
  </main>
</body>
</html>
